# Once a day, ask each live data service for real data and run it through the display's own
# translators. If a service changes its format or stops answering, this run fails and GitHub
# emails the repository owner, before anyone's display notices.
name: Daily data check

on:
  schedule:
    - cron: "17 21 * * *"   # 21:17 UTC = morning in Adelaide, evening in London
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the checker (the display's translators, compiled for Linux)
        run: |
          git clone --quiet --depth 1 --branch v7.4.3 https://github.com/bblanchon/ArduinoJson.git "$RUNNER_TEMP/ajson"
          g++ -std=c++17 -O1 -Ilib/gridcore -I"$RUNNER_TEMP/ajson/src" tools/check_api.cpp lib/gridcore/*.cpp -o check_api

      - name: Great Britain (Carbon Intensity API, no key)
        run: |
          curl -sf https://api.carbonintensity.org.uk/regional/regionid/13 -o ci.json
          ./check_api ci ci.json
          curl -sf "https://api.carbonintensity.org.uk/regional/intensity/$(date -u +%Y-%m-%dT%H:%MZ)/pt24h/regionid/18" -o cih.json
          ./check_api cih cih.json

      - name: Australia (Open Electricity, uses the OE_KEY secret if it's set)
        env:
          OE_KEY: ${{ secrets.OE_KEY }}
        run: |
          if [ -z "$OE_KEY" ]; then echo "No OE_KEY secret set: skipping Australia"; exit 0; fi
          START=$(TZ=Etc/GMT-10 date -d '-40 min' +%Y-%m-%dT%H:%M:00)
          curl -sf -H "Authorization: Bearer $OE_KEY" \
            "https://api.openelectricity.org.au/v4/data/network/NEM?metrics=power&interval=5m&network_region=SA1&secondary_grouping=fueltech&date_start=$START" -o oe.json
          ./check_api oe oe.json
