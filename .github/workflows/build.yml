# Builds the firmware on every push to main and publishes the browser flasher to GitHub Pages.
# One-time setup: repo Settings > Pages > Source = "GitHub Actions".

name: Build firmware and flasher

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO and esptool
        run: pip install platformio esptool

      - name: Test the data translators, tariff engine, settings and refresh timing
        run: pio test -e native

      - name: Build the simulator and render every screen
        run: |
          pip install pillow
          git clone --quiet --depth 1 --branch v9.6.0 https://github.com/lvgl/lvgl.git "$RUNNER_TEMP/lvgl"
          git clone --quiet --depth 1 --branch v7.4.3 https://github.com/bblanchon/ArduinoJson.git "$RUNNER_TEMP/ajson"
          LVGL_DIR="$RUNNER_TEMP/lvgl" AJSON_DIR="$RUNNER_TEMP/ajson" BUILD_DIR="$RUNNER_TEMP/sim-build" sim/build.sh sim-out --frames 40
          python scripts/sim_gallery.py sim-out "$(cat VERSION | tr -d '[:space:]')"

      - name: Build the browser simulator (WebAssembly)
        run: |
          docker run --rm -v "$PWD":/src -v "$RUNNER_TEMP":/deps -w /src -u "$(id -u):$(id -g)" \
            -e EM_CACHE=/deps/emcache -e BUILD_ID="${GITHUB_SHA::8}" -e LVGL_DIR=/deps/lvgl -e AJSON_DIR=/deps/ajson -e BUILD_DIR=/deps/web-build \
            emscripten/emsdk:3.1.74 sim/build_web.sh sim-web

      - name: Check the display's root certificates still verify the data APIs
        run: |
          for host in api.openelectricity.org.au api.eia.gov api.carbonintensity.org.uk odre.opendatasoft.com fisher21james.github.io; do
            echo | openssl s_client -connect $host:443 -servername $host -CAfile data/ca_roots.pem -verify_return_error 2>/dev/null | grep -q "Verify return code: 0 (ok)" \
              && echo "$host: OK" || { echo "::error::$host no longer verifies against data/ca_roots.pem"; exit 1; }
          done

      - name: Build firmware
        run: pio run -e jc4827w543

      - name: Merge into one flashable image
        run: |
          BUILD=.pio/build/jc4827w543
          BOOT_APP0=$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -n 1)
          python -m esptool --chip esp32s3 merge_bin \
            -o gridmix-merged.bin \
            --flash_mode dio --flash_size 4MB \
            0x0     $BUILD/bootloader.bin \
            0x8000  $BUILD/partitions.bin \
            0xe000  "$BOOT_APP0" \
            0x10000 $BUILD/firmware.bin

      - name: Assemble flasher site
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          mkdir -p site/firmware
          cp -r web/* site/
          cp gridmix-merged.bin site/firmware/
          # Over-the-air update: the app on its own, plus what the display needs to check it
          APP=.pio/build/jc4827w543/firmware.bin
          cp $APP site/firmware/gridmix-app.bin
          printf '{"version":"%s","build":%s,"url":"https://fisher21james.github.io/gridmix/firmware/gridmix-app.bin","size":%s,"sha256":"%s"}\n' \
            "$VERSION" "$GITHUB_RUN_NUMBER" "$(stat -c %s $APP)" "$(sha256sum $APP | cut -d' ' -f1)" > site/firmware/ota.json
          cat site/firmware/ota.json
          mkdir -p site/setup-demo
          cp device-web/setup.html site/setup-demo/index.html
          cp -r sim-web site/sim
          cp -r sim-out site/sim/screens
          sed "s/__VERSION__/$VERSION/" web/firmware/manifest.json > site/firmware/manifest.json
          sed -i "s/__VERSION__/$VERSION/" site/index.html

      - name: Keep the firmware as a downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gridmix-firmware
          path: gridmix-merged.bin

      - name: Keep the simulator screens too
        uses: actions/upload-artifact@v4
        with:
          name: gridmix-sim
          path: |
            sim-out
            sim-web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
