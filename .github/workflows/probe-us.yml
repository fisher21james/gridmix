# One-off: save a real answer from each US grid operator for the tests. Run by hand, download the artifact.
name: Probe US grid data
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch
        run: |
          mkdir out && cd out
          date -u > when.txt
          ET=$(TZ=America/New_York date +%Y%m%d)
          curl -sS --max-time 60 -o caiso.csv https://www.caiso.com/outlook/current/fuelsource.csv
          curl -sS --max-time 60 -o miso.json https://public-api.misoenergy.org/api/FuelMix
          curl -sS --max-time 60 -o miso_today.json https://public-api.misoenergy.org/api/FuelMix/Today
          curl -sS --max-time 60 -o spp.csv "https://portal.spp.org/file-browser-api/download/generation-mix-historical?path=/SPP/GenMix2Hour_SPP.csv"
          curl -sS --max-time 60 -o ercot.json https://www.ercot.com/api/1/services/read/dashboards/fuel-mix.json
          curl -sS --max-time 60 -o nyiso.csv "https://mis.nyiso.com/public/csv/rtfuelmix/${ET}rtfuelmix.csv"
          curl -sS --max-time 60 -o isone.json -X POST -d "_nstmp_requestType=fuelmix&_nstmp_fuelType=all" https://www.iso-ne.com/ws/wsclient
          curl -sS --max-time 60 -o bpa.txt https://transmission.bpa.gov/business/operations/wind/baltwg.txt
          ls -la
      - name: Push to the probe-samples branch
        run: |
          cd out
          git init -q -b probe-samples
          git config user.name "probe" && git config user.email "probe@users.noreply.github.com"
          git add -A && git commit -qm "US samples $(cat when.txt)"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-samples
