# One-off: how fresh is each US grid operator's fuel mix? Run by hand (Actions tab), read the log.
name: Probe US grid data
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          date -u
          p() { echo; echo "=== $1"; shift; curl -sS -L --max-time 40 -A "gridmix-probe" -D h.txt -o b.txt "$@" ; echo "exit $?"; grep -iE "^(HTTP|content-type|last-modified|content-length)" h.txt; echo "bytes $(wc -c < b.txt)"; head -c 600 b.txt; echo; echo "--- tail"; tail -c 500 b.txt; echo; }
          p SPP1 "https://portal.spp.org/file-browser-api/download/generation-mix-historical?path=%2FGenMix2Hour.csv"
          p SPP2 "https://portal.spp.org/file-browser-api/download/generation-mix-historical?path=/GenMix2Hour.csv"
          p ISONE-ws2 -X POST -d "_nstmp_formDate=0&_nstmp_startDate=&_nstmp_endDate=&_nstmp_twodays=false&_nstmp_twodaysCheckbox=false&_nstmp_requestType=fuelmix&_nstmp_fuelType=all&_nstmp_height=250" "https://www.iso-ne.com/ws/wsclient"
          echo; echo "=== BPA head"; curl -sS --max-time 40 https://transmission.bpa.gov/business/operations/wind/baltwg.txt | sed -n 10,14p
          echo; echo "=== BPA last filled rows"; curl -sS --max-time 40 https://transmission.bpa.gov/business/operations/wind/baltwg.txt | awk -F'\t' 'NF>2 && $2!=""' | tail -3
