; Grid Mix Display — firmware for the Guition JC4827W543 (ESP32-S3, 4.3" 480x272)
; Build:   pio run -e jc4827w543
; Flash:   pio run -e jc4827w543 -t upload   (or use the browser flasher in /web)

[platformio]
default_envs = jc4827w543

[env:jc4827w543]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; Module is ESP32-S3-WROOM-1-N4R8: 4 MB flash (quad), 8 MB PSRAM (octal)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 4MB
board_build.partitions = default.csv   ; two app slots, so over-the-air updates work later

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1      ; Serial goes over the built-in USB, needed for the web flasher's Wi-Fi step
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude

; Reads the version number from the VERSION file so firmware and flasher always match
extra_scripts = pre:scripts/version.py

lib_deps =
    moononournation/GFX Library for Arduino@^1.5.0
    lvgl/lvgl@^9.2.0
    bblanchon/ArduinoJson@^7.2.0
    tamctec/TAMC_GT911@^1.0.2
    jnthas/Improv WiFi Library@^0.0.2
